
name: To-Do App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Validate HTML file is not empty
        run: test -s index.html

      - name: Validate JavaScript file is not empty
        run: test -s script.js
